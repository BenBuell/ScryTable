name: Deploy ScryTable 3.0.6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-scrytable-3.0.6.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify release
        shell: bash
        run: |
          set -euo pipefail
          url='https://drive.usercontent.google.com/download?id=1cFhZPv1tD4jWAonNcfva6R_83zyas8IU&export=download&confirm=t'
          curl --fail --location --retry 3 --output /tmp/scrytable-3.0.6.zip "$url"
          echo '2a78fadf229faab08229ab5473dcca7d171fa792eae4f10f45f48f8c2a30bd1a  /tmp/scrytable-3.0.6.zip' | sha256sum --check --strict
          mkdir -p /tmp/scrytable-3.0.6
          unzip -q /tmp/scrytable-3.0.6.zip -d /tmp/scrytable-3.0.6
          cd /tmp/scrytable-3.0.6
          echo 'cb8bac6bc4b743827726a668c684c62f307a115bcc237ce04af0c982334357af  index.html' | sha256sum --check --strict
          echo '441c9f617f66513c20e037253c2624c79ea9ab719d85aa768595bd6ac29a0a17  scrytable-lite.html' | sha256sum --check --strict
          echo '508db2b07e29721efac68624848236e4d1153b616dba1ef3e4a47f16c23d6838  pwa.js' | sha256sum --check --strict
          echo '968cc157cef602027b911b216cb8a0d5108d69d189c74d9cef3e35bf000df28d  sw.js' | sha256sum --check --strict
          echo 'a04d188c7a054c1363bbf46c383d4a7a90ccfed3fd24f97d7d768f433824dbe5  firebase-rules-snippet.json' | sha256sum --check --strict
          echo '70a778bdbc6657bbb453e47d804c950072de6a5d9d6417cb21bd4a63271e3ff3  RELEASE-3.0.6.md' | sha256sum --check --strict
          echo '8555bcf964d5f90b0882a27b207198648eba709abbbd86f30c8d3be9e6ccafd6  scripts/build-lite.cjs' | sha256sum --check --strict

      - name: Replace release files and preserve everything else
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/scrytable-3.0.6/index.html index.html
          cp /tmp/scrytable-3.0.6/scrytable-lite.html scrytable-lite.html
          cp /tmp/scrytable-3.0.6/pwa.js pwa.js
          cp /tmp/scrytable-3.0.6/sw.js sw.js
          cp /tmp/scrytable-3.0.6/firebase-rules-snippet.json firebase-rules-snippet.json
          cp /tmp/scrytable-3.0.6/RELEASE-3.0.6.md RELEASE-3.0.6.md
          mkdir -p scripts
          cp /tmp/scrytable-3.0.6/scripts/build-lite.cjs scripts/build-lite.cjs
          rm -f .github/workflows/deploy-scrytable-3.0.6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Release ScryTable 3.0.6: PWA, mobile, join, and rules fixes'
          git push origin HEAD:main
